<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D 3.5 Character Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <label class="view-switcher">
          View
          <select id="viewSelect">
            <option value="/">Character Builder</option>
            <option value="/dm/">DM Character Roster</option>
          </select>
        </label>
        <h1>D&D 3.5 Builder</h1>

        <section class="panel">
          <h2>Identity</h2>
          <label>
            Character Name
            <input id="charName" type="text" value="Unnamed Hero" />
          </label>
          <label>
            Player Name
            <input id="playerName" type="text" value="Player" />
          </label>
          <label>
            Gender Presentation
            <select id="genderSelect">
              <option value="unspecified">Unspecified</option>
              <option value="feminine">Feminine</option>
              <option value="masculine">Masculine</option>
              <option value="androgynous">Androgynous</option>
            </select>
          </label>
          <label>
            Character Image (optional)
            <input id="portraitInput" type="file" accept="image/png,image/jpeg,image/webp" />
          </label>
          <button id="clearPortraitBtn" class="secondary-btn" type="button">Use Generated Sketch</button>
          <label>
            Race
            <select id="raceSelect"></select>
          </label>
          <label>
            Class
            <select id="classSelect"></select>
            <span id="classDisplay" class="class-display" hidden></span>
          </label>
          <label>
            Level
            <input id="levelInput" type="number" min="1" max="20" value="1" />
            <span id="levelDisplay" class="class-display" hidden></span>
          </label>
          <label>
            Alignment
            <select id="alignmentSelect">
              <option>Lawful Good</option>
              <option>Neutral Good</option>
              <option>Chaotic Good</option>
              <option>Lawful Neutral</option>
              <option>True Neutral</option>
              <option>Chaotic Neutral</option>
              <option>Lawful Evil</option>
              <option>Neutral Evil</option>
              <option>Chaotic Evil</option>
            </select>
          </label>
          <label>
            Deity / Allegiance
            <select id="deitySelect">
              <option>None selected</option>
            </select>
          </label>
          <button id="levelUpBtn" class="secondary-btn identity-level-btn" type="button" hidden>Level Up Character</button>
          <button id="undoLastLevelBtn" class="secondary-btn identity-level-btn" type="button" hidden>Undo Last Level</button>
        </section>

        <section id="classLevelsPanel" class="panel">
          <h2>Class Levels</h2>
          <div id="classLevelsList" class="class-levels-list"></div>
          <label>
            Class for this level
            <select id="advancementClassSelect"></select>
          </label>
          <div class="class-level-actions">
            <button id="addClassLevelBtn" class="secondary-btn" type="button">Add Level</button>
            <button id="rollHpBtn" class="secondary-btn" type="button" disabled>Roll HP</button>
            <button id="undoLevelBtn" class="secondary-btn" type="button">Undo Level</button>
          </div>
          <p id="hpRollResult" class="hp-roll-result"></p>
        </section>

        <section class="panel">
          <h2>Campaign Setting</h2>
          <label>
            Ruleset
            <select id="settingSelect">
              <option value="core">D&D 3.5 Core</option>
              <option value="dragonlance">Dragonlance 3.5</option>
            </select>
          </label>
          <label>
            Krynn Path
            <select id="krynnPathSelect">
              <option value="none">No setting path</option>
              <option value="knight-solamnia">Knight of Solamnia</option>
              <option value="knight-takhisis">Knight of Takhisis</option>
              <option value="high-sorcery">Wizard of High Sorcery</option>
              <option value="wild-magic">Renegade / Wild Magic</option>
            </select>
          </label>
          <label>
            Moon or Power
            <select id="moonSelect">
              <option value="none">None selected</option>
              <option value="solinari">Solinari (white moon)</option>
              <option value="lunitari">Lunitari (red moon)</option>
              <option value="nuitari">Nuitari (black moon)</option>
              <option value="constellation">Constellation / divine power</option>
            </select>
          </label>
          <label>
            Prestige Class
            <select id="prestigeClassSelect">
              <option value="none">None selected</option>
              <option value="knight-of-the-crown">Knight of the Crown</option>
              <option value="knight-of-the-sword">Knight of the Sword</option>
              <option value="knight-of-the-rose">Knight of the Rose</option>
              <option value="knight-of-neraka">Knight of Neraka</option>
              <option value="renegade-hunter">Renegade Hunter</option>
              <option value="white-robed-wizard">White-Robed Wizard</option>
              <option value="red-robed-wizard">Red-Robed Wizard</option>
              <option value="black-robed-wizard">Black-Robed Wizard</option>
              <option value="master-of-the-way">Master of the Way</option>
            </select>
          </label>
        </section>

        <section class="panel">
          <h2>Languages</h2>
          <div id="languagesList" class="language-list"></div>
        </section>

        <section class="panel">
          <h2>Deeds & Notable Events</h2>
          <div id="deedsList" class="deeds-editor-list"></div>
          <button id="addDeedBtn" class="secondary-btn" type="button">Add Deed</button>
        </section>

        <section class="panel">
          <h2>Journal Notes</h2>
          <h3>Character Notes</h3>
          <div id="characterNotesList" class="deeds-editor-list"></div>
          <button id="addCharacterNoteBtn" class="secondary-btn" type="button">Add Character Note</button>
          <h3>Additional Campaign Notes</h3>
          <div id="campaignNotesList" class="deeds-editor-list"></div>
          <button id="addCampaignNoteBtn" class="secondary-btn" type="button">Add Campaign Note</button>
        </section>

        <section id="abilityScoresPanel" class="panel">
          <h2>Ability Scores</h2>
          <div id="abilityGenerationControls">
          <label>
            Generation Method
            <select id="abilityModeSelect">
              <option value="rolled">Roll 4d6, Drop Lowest, Then Assign</option>
              <option value="point-buy">Point Buy</option>
              <option value="manual">Manual Entry</option>
            </select>
          </label>
          <label id="pointBuyBudgetLabel">
            Point-Buy Budget
            <select id="pointBuyBudgetSelect">
              <option value="15">15 points</option>
              <option value="22">22 points</option>
              <option value="25">25 points</option>
              <option value="28">28 points</option>
              <option value="32" selected>32 points</option>
            </select>
          </label>
          <p id="abilityMethodInfo" class="ability-method-info"></p>
          <button id="rollStatsBtn" class="primary-btn">Roll 4d6 Drop Lowest</button>
          </div>
          <div id="abilities" class="ability-grid"></div>
          <div id="abilityIncreasePanel" class="ability-increase-panel" hidden>
            <strong>Level-up ability increase available</strong>
            <select id="abilityIncreaseSelect" aria-label="Ability to increase">
              <option value="str">Strength</option><option value="dex">Dexterity</option><option value="con">Constitution</option><option value="int">Intelligence</option><option value="wis">Wisdom</option><option value="cha">Charisma</option>
            </select>
            <button id="applyAbilityIncreaseBtn" class="secondary-btn" type="button">Apply +1</button>
            <small id="abilityIncreaseInfo"></small>
          </div>
        </section>

        <section class="panel">
          <h2 id="skillsHeading">Skills</h2>
          <div id="skillsList" class="checkbox-list"></div>
        </section>

        <section class="panel">
          <h2 id="featsHeading">Feats</h2>
          <div id="featsList" class="checkbox-list"></div>
        </section>

        <section class="panel">
          <h2>Equipment & Magic</h2>
          <label>
            Weapon
            <select id="weaponSelect"></select>
            <button id="weaponRulesTrigger" class="rules-trigger equipment-rules-trigger" type="button" data-rule-type="weapon" data-rule-name="Longsword">View weapon rules</button>
            <button id="addWeaponBtn" class="secondary-btn equipment-add-btn" type="button">Add weapon to inventory</button>
            <select id="weaponEnhancementSelect" aria-label="Weapon enhancement">
              <option value="0">No enhancement</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="4">+4</option><option value="5">+5</option>
            </select>
            <select id="weaponAbilitySelect" aria-label="Weapon special ability"><option value="none">No special ability</option><option value="flaming">Flaming</option><option value="frost">Frost</option><option value="shock">Shock</option><option value="keen">Keen</option><option value="holy">Holy</option><option value="bane">Bane</option></select>
            <select id="weaponSizeSelect" aria-label="Weapon size">
              <option value="auto">Weapon size: Auto</option>
              <option value="small">Weapon size: Small</option>
              <option value="medium">Weapon size: Medium</option>
              <option value="large">Weapon size: Large</option>
            </select>
          </label>
          <label>
            Armor
            <select id="armorSelect"></select>
            <button id="armorRulesTrigger" class="rules-trigger equipment-rules-trigger" type="button" data-rule-type="armor" data-rule-name="Chain Shirt">View armor rules</button>
            <button id="addArmorBtn" class="secondary-btn equipment-add-btn" type="button">Add armor to inventory</button>
            <select id="armorEnhancementSelect" aria-label="Armor enhancement">
              <option value="0">No enhancement</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="4">+4</option><option value="5">+5</option>
            </select>
            <select id="armorAbilitySelect" aria-label="Armor special ability"><option value="none">No special ability</option><option value="fortification">Light Fortification</option><option value="glamered">Glamered</option><option value="shadow">Shadow</option><option value="slick">Slick</option></select>
          </label>
          <label>
            Item
            <select id="itemSelect"></select>
          </label>
          <label>
            Magic Item
            <select id="magicItemSelect"></select>
            <button id="addMagicItemBtn" class="secondary-btn equipment-add-btn" type="button">Add magic item to inventory</button>
          </label>
          <div id="equipmentInventory" class="equipment-inventory"></div>
        </section>

        <section class="panel">
          <h2 id="spellsHeading">Spells</h2>
          <p id="spellCapacityInfo" class="ability-method-info"></p>
          <div id="spellList" class="checkbox-list"></div>
        </section>

        <section class="panel completion-panel">
          <button id="completeCharacterBtn" class="primary-btn" type="button">Create Character</button>
          <p id="completionStatus" class="completion-status"></p>
        </section>
      </aside>

      <main class="main-content">
        <div class="controls-row">
          <button id="saveBtn" class="primary-btn">Save</button>
          <button id="newBtn" class="secondary-btn">Create New</button>
          <button id="generatePlayerBtn" class="primary-btn">Generate Player Sheet</button>
          <button id="generateSketchBtn" class="secondary-btn">Generate Character Sketch</button>
          <button id="choosePortraitBtn" class="secondary-btn" type="button">Choose Character Image</button>
          <button id="exportBtn" class="secondary-btn">Export JSON</button>
          <button id="loadBtn" class="secondary-btn">Load JSON</button>
          <button id="printBtn" class="accent-btn">Print</button>
        </div>
        <input id="importCharacterInput" type="file" accept="application/json" hidden />

        <section id="summaryCard" class="summary-card"></section>

        <section class="sheet-output">
          <div class="sheet-section" id="playerSheet"></div>
          <div class="sheet-section" id="sketchSheet"></div>
          <div class="sheet-section" id="deedsSheet"></div>
        </section>
      </main>
    </div>

    <aside id="rulesPopover" class="rules-popover" hidden></aside>

    <div id="printPreviewModal" class="print-preview-modal" hidden>
      <div class="print-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="printPreviewTitle">
        <div class="print-preview-header">
          <h2 id="printPreviewTitle">Print Preview</h2>
          <button id="closePrintPreviewBtn" class="secondary-btn" type="button">Close Preview</button>
        </div>
        <div id="printPreviewContent" class="print-preview-content"></div>
        <div class="print-preview-actions">
          <button id="printPreviewPrintBtn" class="accent-btn" type="button">Print Now</button>
        </div>
      </div>
    </div>

    <script src="app.js?v=sync-1"></script>
    <script>
      document.querySelector('#viewSelect').addEventListener('change', (event) => {
        window.location.href = window.location.protocol === 'file:'
          ? 'dm/index.html'
          : event.target.value;
      });
    </script>
  </body>
</html>
